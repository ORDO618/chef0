<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded edges -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Chef Hat / Cloche Zero-Waste Eco Symbol -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Base Plate / Ring -->
    <path d="M 64 380 Q 256 420 448 380 Q 256 460 64 380 Z" fill="url(#emeraldGrad)"/>
    
    <!-- Chef Hat Main Dome -->
    <path d="M 120 340 C 90 280 110 200 170 170 C 180 120 240 90 290 110 C 340 80 410 120 400 190 C 440 230 430 300 392 340 Z" fill="url(#emeraldGrad)" opacity="0.95"/>
    
    <!-- Zero Infinity Leaf Loop in center -->
    <path d="M 256 160 C 210 160 180 200 180 250 C 180 300 220 330 256 330 C 292 330 332 300 332 250 C 332 200 302 160 256 160 Z M 256 200 C 280 200 296 222 296 250 C 296 278 280 294 256 294 C 232 294 216 278 216 250 C 216 222 232 200 256 200 Z" fill="#020617"/>
    
    <!-- Fresh Sprout Leaves -->
    <path d="M 256 120 Q 290 60 340 70 Q 320 110 266 126 Z" fill="url(#leafGrad)"/>
    <path d="M 246 120 Q 200 65 160 85 Q 185 125 238 126 Z" fill="url(#leafGrad)"/>
  </g>
</svg>
